<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="375" viewBox="0 0 1080 375" role="img" aria-label="Composición del código">
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F5F2FD"/><stop offset="49%" stop-color="#F4FBFA"/><stop offset="100%" stop-color="#FFF5F7"/></linearGradient></defs>
<rect x="0" y="0" width="1080" height="375" rx="28" fill="url(#wash)" stroke="none" />
<rect x="32" y="34" width="7" height="37" rx="3" fill="#9CCFC3" stroke="none" />
<text x="56" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#334155" text-anchor="start">Composición del código</text>
<text x="56" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Diferente del porcentaje por repositorios</text>
